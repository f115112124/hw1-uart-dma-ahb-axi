<svg xmlns="http://www.w3.org/2000/svg" width="900" height="741" viewBox="0 0 900 741">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087F8C"/></marker></defs>
<rect x="4.0" y="5" width="132" height="40" rx="8" fill="#EAF2FA" stroke="#90AABD"/>
<text x="70.0" y="30" text-anchor="middle" font-family="Arial" font-size="15" fill="#142B49">CPU (M0)</text>
<line x1="70.0" y1="45" x2="70.0" y2="731" stroke="#AEBBC9" stroke-dasharray="5 5"/>
<rect x="194.0" y="5" width="132" height="40" rx="8" fill="#EAF2FA" stroke="#90AABD"/>
<text x="260.0" y="30" text-anchor="middle" font-family="Arial" font-size="15" fill="#142B49">IP CSR (S1)</text>
<line x1="260.0" y1="45" x2="260.0" y2="731" stroke="#AEBBC9" stroke-dasharray="5 5"/>
<rect x="384.0" y="5" width="132" height="40" rx="8" fill="#EAF2FA" stroke="#90AABD"/>
<text x="450.0" y="30" text-anchor="middle" font-family="Arial" font-size="15" fill="#142B49">DMA (M1)</text>
<line x1="450.0" y1="45" x2="450.0" y2="731" stroke="#AEBBC9" stroke-dasharray="5 5"/>
<rect x="574.0" y="5" width="132" height="40" rx="8" fill="#EAF2FA" stroke="#90AABD"/>
<text x="640.0" y="30" text-anchor="middle" font-family="Arial" font-size="15" fill="#142B49">Memory (S0)</text>
<line x1="640.0" y1="45" x2="640.0" y2="731" stroke="#AEBBC9" stroke-dasharray="5 5"/>
<rect x="764.0" y="5" width="132" height="40" rx="8" fill="#EAF2FA" stroke="#90AABD"/>
<text x="830.0" y="30" text-anchor="middle" font-family="Arial" font-size="15" fill="#142B49">UART</text>
<line x1="830.0" y1="45" x2="830.0" y2="731" stroke="#AEBBC9" stroke-dasharray="5 5"/>
<line x1="70.0" y1="80" x2="260.0" y2="80" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="165.0" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">SINGLE writes: SRC=0x100, LEN=4, CTRL=1</text>
<line x1="260.0" y1="133" x2="70.0" y2="133" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="165.0" y="123" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">Each write: HREADY=1, HRESP=OKAY</text>
<line x1="260.0" y1="186" x2="450.0" y2="186" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="355.0" y="176" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">START memory-to-UART</text>
<line x1="450.0" y1="239" x2="640.0" y2="239" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="545.0" y="229" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">HBUSREQ; wait for granted ownership</text>
<line x1="450.0" y1="292" x2="640.0" y2="292" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="545.0" y="282" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">Read INCR4: NONSEQ A0, then 3 x SEQ</text>
<line x1="640.0" y1="345" x2="450.0" y2="345" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="545.0" y="335" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">HREADY=0 inserts wait; hold current phase</text>
<line x1="640.0" y1="398" x2="450.0" y2="398" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="545.0" y="388" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">4 accepted read data beats</text>
<line x1="450.0" y1="451" x2="830.0" y2="451" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="640.0" y="441" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">Send low bytes: H, W, 1, ! (8N1)</text>
<line x1="830.0" y1="504" x2="450.0" y2="504" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="640.0" y="494" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">Final stop bit completed</text>
<line x1="450.0" y1="557" x2="260.0" y2="557" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="355.0" y="547" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">DMA_DONE=1</text>
<line x1="70.0" y1="610" x2="260.0" y2="610" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="165.0" y="600" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">SINGLE read STATUS</text>
<line x1="260.0" y1="663" x2="70.0" y2="663" stroke="#087F8C" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="165.0" y="653" text-anchor="middle" font-family="Arial" font-size="14" fill="#142B49">DONE=1, BUSY=0, ERROR=0</text>
</svg>